name: Crawl Taoyuan Airport TXT (passenger + cargo)

on:
  schedule:
    # 每 3 小時第 17 分（UTC），避開整點高峰。台北時間 = UTC+8。
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawl-taoyuan
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write temporary rclone config from secret
        # 注意：環境變數不能叫 RCLONE_CONFIG，那是 rclone 保留的「config 檔路徑」變數，
        # 會導致 rclone 把 secret 內容當成檔名並印在 log 裡。
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONF_CONTENT" ]; then
            echo "錯誤：RCLONE_CONFIG secret 為空" >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          unset RCLONE_CONF_CONTENT
          # 只做結構檢查，不印任何內容
          if ! grep -q '^\[gdrive\]' ~/.config/rclone/rclone.conf; then
            echo "錯誤：rclone config 中找不到 [gdrive] 區段，請檢查 secret 內容" >&2
            exit 1
          fi
          echo "rclone config written ($(wc -l < ~/.config/rclone/rclone.conf) lines)"
          echo "rclone remotes:"
          rclone listremotes 2>/dev/null | grep -E '^[A-Za-z0-9_-]+:$' \
            || { echo "錯誤：rclone 無法讀取 config 或沒有任何 remote" >&2; exit 1; }

      - name: Crawl passenger TXT
        run: python crawlers/crawler_taoyuan_passenger.py

      - name: Upload passenger TXT to Google Drive
        run: bash scripts/upload_to_gdrive.sh taoyuan_passenger

      - name: Crawl cargo TXT
        run: python crawlers/crawler_taoyuan_cargo.py

      - name: Upload cargo TXT to Google Drive
        run: bash scripts/upload_to_gdrive.sh taoyuan_cargo

      - name: Remove temporary rclone config
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
